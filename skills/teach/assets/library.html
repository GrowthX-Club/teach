<script id="teach-catalogue" type="application/json">
/*@@CATALOGUE@@*/
</script>
<script>window.LIBRARY = [];</script>
<!--@@ENTRIES@@-->
<script>
(function () {
  var DEPTH = { 1: "I'm new to this", 2: "I know the basics", 3: "I use it at work", 4: "I know it well" };
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function plain(s) { return String(s || "").replace(/\*\*([^*]+)\*\*/g, "$1").replace(/`([^`]+)`/g, "$1"); }
  var areas = [];
  try { areas = JSON.parse(document.getElementById("teach-catalogue").textContent).areas; } catch (e) {}
  var areaName = {};
  areas.forEach(function (a) { areaName[a.id] = a.name; });
  var items = (window.LIBRARY || []).slice().sort(function (a, b) { return a.dir < b.dir ? 1 : -1; });
  var grid = document.getElementById("grid");
  document.getElementById("count").textContent = items.length + (items.length === 1 ? " lesson" : " lessons");
  function render(q) {
    q = (q || "").toLowerCase();
    var shown = items.filter(function (it) {
      var l = it.lesson || {};
      var hay = [plain(l.meta && l.meta.title), l.meta && l.meta.subject, l.meta && l.meta.domain]
        .concat((l.concepts || []).map(function (c) { return c.name; })).join(" ").toLowerCase();
      return !q || hay.indexOf(q) !== -1;
    });
    if (!items.length) {
      grid.innerHTML = '<div class="empty">No lessons yet. Finish something in your coding agent and type <code>teach</code>.</div>';
      return;
    }
    if (!shown.length) {
      grid.innerHTML = '<div class="empty">No lessons match that search.</div>';
      return;
    }
    grid.innerHTML = '<ol class="lib-list">' + shown.map(function (it) {
      var l = it.lesson || {}, m = l.meta || {}, level = m.level || {};
      var tags = (areaName[m.domain] ? '<span class="tag area">' + esc(areaName[m.domain]) + "</span>" : "") +
        (l.concepts || []).map(function (c) { return '<span class="tag">' + esc(plain(c.name)) + "</span>"; }).join("");
      return '<li><a class="lib-row" href="lessons/' + encodeURIComponent(it.dir) + '/index.html">' +
        '<span class="lib-meta">' + esc([m.created, DEPTH[level.depth]].filter(Boolean).join(" · ")) + "</span>" +
        "<h3>" + esc(plain(m.title)) + "</h3>" +
        (tags ? '<span class="tags">' + tags + "</span>" : "") + "</a></li>";
    }).join("") + "</ol>";
  }
  // External links always open in a new tab, even in browsers that ignore target="_blank".
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[href]");
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
    var url;
    try { url = new URL(a.getAttribute("href"), location.href); } catch (err) { return; }
    if (!/^https?:$/.test(url.protocol) || url.origin === location.origin) return;
    var win = window.open(url.href, "_blank");
    if (win) {
      win.opener = null;
      e.preventDefault();
    }
  });
  document.getElementById("search").addEventListener("input", function (e) { render(e.target.value); });
  render("");

  var root = document.documentElement;
  // Opens light until the learner switches; shared with every lesson.
  try { var t = localStorage.getItem("teach:theme") || localStorage.getItem("teach:library:theme"); if (t) root.setAttribute("data-theme", t); } catch (e) {}
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("teach:theme", next); } catch (e) {}
  });
})();
</script>
